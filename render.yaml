services:
  - type: web
    name: youtube-quiz-generator
    # Docker build — works on Render, Railway, Fly.io, Cloud Run, etc.
    # Render auto-detects the Dockerfile and builds the image.
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: PORT
        generateValue:
          rule: "3000"  # Render provides PORT automatically; this is a fallback
    plan: free