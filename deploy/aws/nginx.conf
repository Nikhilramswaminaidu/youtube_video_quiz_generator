# ──────────────────────────────────────────────────────────────
# YouTube Quiz Generator — Nginx Reverse Proxy Configuration
# ──────────────────────────────────────────────────────────────
# Install to: /etc/nginx/sites-available/quiz-generator
# Enable with: sudo ln -sf /etc/nginx/sites-available/quiz-generator /etc/nginx/sites-enabled/
#              sudo nginx -t && sudo systemctl reload nginx
#
# Key design decisions:
#   - SSE endpoint (/api/quiz/generate/stream) gets 300s timeouts and
#     proxy_buffering off to prevent connection drops during LLM calls
#   - Other routes get 120s timeouts (PDF generation can be slow)
#   - Gzip compression for JSON and text responses
#   - Security headers on all responses
# ──────────────────────────────────────────────────────────────

# Upstream gunicorn server
upstream quiz_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;  # Accepts any hostname / IP

    # ── Security headers ──────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Gzip compression ──────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;
    gzip_comp_level 4;

    # ── SSE streaming endpoint (long timeouts, no buffering) ──
    # This is the critical config that fixes "connection was lost" errors.
    # LLM calls can take 30-120s each, and a full quiz with multiple
    # batches can take 2-5 minutes. Nginx must not close the connection.
    location /api/quiz/generate/stream {
        proxy_pass http://quiz_app;
        proxy_http_version 1.1;

        # Long timeouts: 5 minutes to cover multi-batch quiz generation
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        # Disable ALL buffering — SSE events must be sent immediately
        proxy_buffering off;
        proxy_cache off;

        # SSE requires the Connection header to be cleared
        # (not set to "close" or "upgrade")
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── All other API and frontend routes ─────────────────────
    location / {
        proxy_pass http://quiz_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeout for PDF generation and long API calls
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}